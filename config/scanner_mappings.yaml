# Scanner column name mappings to VRA's internal schema.
# Each scanner adapter uses this file to normalise column names.
#
# The CSV generic adapter picks the mapping that renames the MOST columns
# (best-match wins), so more specific formats should have more entries.

# ── Tenable SecurityCenter / Nessus.sc export ─────────────────────────────────
# Columns: Plugin, Plugin Name, Family, Severity, VPR, IP Address, DNS Name, etc.
# CVE IDs are embedded in Plugin Name as "(CVE-YYYY-NNNN)" — extracted by the adapter.
tenable_sc:
  "IP Address": ip_address
  "DNS Name": hostname
  "NetBIOS Name": hostname_netbios     # fallback if DNS Name is empty
  "Severity": severity
  "Plugin": plugin_id
  "Plugin Name": plugin_name
  "Family": plugin_family
  "VPR": cvss_base_score              # VPR (0–10) used as CVSS proxy

# ── Nessus CSV export ─────────────────────────────────────────────────────────
nessus:
  host: hostname
  "IP Address": ip_address
  "CVE": cve_id
  "CVSS v3.0 Base Score": cvss_base_score
  "Risk": severity
  "Plugin Name": plugin_name
  "Synopsis": vuln_title
  "First Discovered": first_seen
  "Last Observed": last_seen
  "Plugin Family": plugin_family

openvas:
  host: hostname
  ip: ip_address
  nvt_oid: plugin_id
  cvss_base: cvss_base_score
  threat: severity
  name: vuln_title
  first_seen: first_seen
  last_seen: last_seen
  family: plugin_family

csv_generic:
  # Minimum required columns; extra columns are passed through as-is
  required:
    - cve_id
    - hostname
    - cvss_base_score
    - severity

# ── ODDO BHF internal RT scanner export ──────────────────────────────────────
# Used by scanner_demo1.csv and scanner_demo_dmz.csv (demo upload scenario).
# Column count (9) must exceed all other entries so best-match selects this one.
oddo_bhf:
  CVE_References: cve_id
  Target_FQDN: hostname
  Target_IPv4: ip_address
  CVSS3_Score: cvss_base_score
  Risk_Rating: severity
  Vulnerability_Title: vuln_title
  Plugin_Group: plugin_family
  First_Detected: first_seen
  Last_Scanned: last_seen
