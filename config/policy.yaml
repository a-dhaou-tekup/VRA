# VRA Policy Configuration
# All weights and thresholds used by the risk engine, SLA engine, and RAG pipeline.

# ── Risk Scoring ─────────────────────────────────────────────────────────────
# Each factor contributes up to its weight value.
# Total maximum score = 100.
risk_scoring:
  weights:
    cvss: 40         # CVSS base score / 10 → [0,1] × 40
    kev: 20          # CISA Known Exploited flag (0 or 1) × 20
    epss: 15         # FIRST EPSS probability [0,1] × 15
    criticality: 15  # Asset criticality multiplier × 15
    exposure: 10     # Internet-exposed flag (0 or 1) × 10

  # Criticality multipliers (applied to criticality weight)
  criticality_map:
    low: 0.25
    medium: 0.50
    high: 0.75
    critical: 1.00

  # Risk level thresholds (score ranges)
  thresholds:
    critical: 80   # score >= 80
    high: 60       # score >= 60
    medium: 40     # score >= 40
                   # score < 40 → Low

# ── SLA Policy ───────────────────────────────────────────────────────────────
# Maximum days to resolve a job per risk level.
sla_days:
  CRITICAL: 7
  HIGH: 14
  MEDIUM: 30
  LOW: 90

# Number of days before SLA expiry to show "Due Soon" warning
sla_due_soon_days: 7

# ── Job Grouping ─────────────────────────────────────────────────────────────
# Group vulnerabilities into remediation jobs by these keys.
job_grouping:
  primary_key: asset_id
  secondary_keys:
    - product_name
    - package
    - plugin_family

# ── RAG / AI Configuration ───────────────────────────────────────────────────
rag:
  model: qwen2.5:14b           # Ollama model — qwen2.5:14b uses ~10 GB VRAM on RTX 4070 Ti Super
  ollama_url: http://localhost:11434
  top_k_chunks: 5              # Number of advisory chunks to retrieve per query
  max_tokens_before_truncation: 6000   # Truncate to top_3 if estimated tokens exceed this
  chroma_persist_dir: data/rag_corpus/chroma_db
  embedding_model: all-MiniLM-L6-v2   # Local embedding model via sentence-transformers
  corpus_dir: data/rag_corpus
  ollama_timeout: 300                  # seconds; override with OLLAMA_TIMEOUT_SECONDS env var

  # ── Hybrid retrieval (feat/rag-hybrid) ──────────────────────────────────────
  # Set to false to A/B against the original two-pass ChromaDB-only path.
  RAG_USE_HYBRID: true
  # Candidates fetched from each retrieval leg before RRF merge
  hybrid_k: 50
  # Documents passed to LLM after cross-encoder re-ranking
  hybrid_top_n: 5
  # Cross-encoder model name (sentence-transformers, ~80 MB)
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

  # ── Multi-collection RAG (feat/rag-multi-collection) ─────────────────────────
  # Set to false to revert to single-collection hybrid_search (A/B on demo day).
  RAG_USE_MULTI_COLLECTION: true
  # Per-source weight multipliers applied after per-collection RRF fusion.
  # Internal runbooks outweigh public CVE descriptions because they are
  # asset-specific.  Override at runtime via env vars:
  #   RAG_WEIGHT_CVE      (default 1.0)
  #   RAG_WEIGHT_ADVISORY (default 1.2)
  #   RAG_WEIGHT_RUNBOOK  (default 1.5)
  collection_weights:
    cve_descriptions:  1.0
    vendor_advisories: 1.2
    internal_runbooks: 1.5

  # Structured output schema enforced via Ollama format:json
  output_schema:
    - summary
    - exploitation_likelihood   # high | medium | low
    - remediation_steps         # list of strings
    - compensating_controls     # list of strings
    - verification              # how to confirm fix
    - references                # list of CVE IDs or vendor URLs
    - confidence                # float 0.0-1.0
